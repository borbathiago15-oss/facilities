<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0f">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Entrar — {{ NOME_DO_SISTEMA }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="fc-login-fundo">
  <div class="fc-login">
    <div class="fc-login-topo">
      <img src="{{ url_for('static', filename='img/logo_trino.png') }}" alt="Grupo Trino">
      <h1>Trino Facilities</h1>
    </div>
    <div class="fc-login-corpo">
      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensagens %}
        <div class="alert alert-{{ categoria }} py-2 small">{{ texto }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label small fw-semibold" for="email">E-mail</label>
        <input class="form-control mb-3" id="email" name="email" type="email" value="{{ email }}"
               autocomplete="username" required autofocus>
        <label class="form-label small fw-semibold" for="password">Senha</label>
        <input class="form-control mb-3" id="password" name="password" type="password"
               autocomplete="current-password" required>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar" value="1">
          <label class="form-check-label small" for="lembrar">Manter conectado neste aparelho</label>
        </div>
        <button class="btn btn-primary w-100 fw-bold" type="submit">Entrar</button>
      </form>
      <p class="small text-muted mt-3 mb-0">Esqueceu a senha? Peça ao administrador uma senha temporária.</p>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/app-instalavel.js') }}"></script>
</body>
</html>
