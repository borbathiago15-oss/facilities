{% extends 'core/_porta.html' %}
{% block aba %}Entrar{% endblock %}
{% block formulario %}
<h1 class="fc-porta-h1">Entrar</h1>
<p class="fc-porta-sub">Use o e-mail e a senha que o administrador cadastrou para você.</p>
<form method="post" autocomplete="on" data-porta>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label fw-semibold" for="email">E-mail</label>
  <div class="fc-campo mb-3">
    <i class="bi bi-envelope" aria-hidden="true"></i>
    <input class="form-control" id="email" name="email" type="email" value="{{ email }}"
           autocomplete="username" inputmode="email" required autofocus placeholder="nome@grupotrino.com.br">
  </div>
  <label class="form-label fw-semibold" for="password">Senha</label>
  <div class="fc-campo mb-3">
    <i class="bi bi-lock" aria-hidden="true"></i>
    <input class="form-control" id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button class="fc-ver-senha" type="button" data-ver-senha="password" aria-label="Mostrar a senha" aria-pressed="false">
      <i class="bi bi-eye" aria-hidden="true"></i>
    </button>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar" value="1">
    <label class="form-check-label" for="lembrar">Manter conectado neste aparelho</label>
  </div>
  <button class="btn btn-primary btn-lg w-100 fw-bold" type="submit" data-enviando="Entrando…">Entrar</button>
</form>
<p class="fc-porta-ajuda"><i class="bi bi-question-circle" aria-hidden="true"></i> Esqueceu a senha? Peça ao administrador uma senha temporária.</p>
{% endblock %}
