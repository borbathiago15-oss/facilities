name: CI

# Um job só, e só em PR para o main e no próprio main: cada minuto de runner
# sai da cota mensal da conta (lição do Trino Intelligence, que esgotou a
# cota com push em toda branch).
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O token do CI só lê o repositório (auditoria SEC-023 / N-23).
permissions:
  contents: read

jobs:
  testes:
    name: Testes (Postgres, como produção)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facilities_testes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/facilities_testes
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/facilities_testes
      SECRET_KEY: ci
      # Chave da cifra dos campos SÓ do CI (core/cifra.py); a de produção
      # fica no Railway e no cofre offline.
      FIELD_ENCRYPTION_KEY: Y2ktY2hhdmUtZGEtY2lmcmEtZG9zLWNhbXBvcy0zMmI=
      SESSION_COOKIE_SECURE: '0'
      # Com Postgres a fábrica recusa subir sem destino de anexos declarado
      # (facilities/object_storage.py): aqui o disco do runner basta.
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Dependências com vulnerabilidade conhecida
        run: pip-audit -r requirements.txt --desc off
      - name: Migração — ida, volta e ida
        run: |
          flask --app facilities db upgrade
          flask --app facilities db downgrade base
          flask --app facilities db upgrade
          flask --app facilities db check
      - name: Suíte
        run: pytest -q
